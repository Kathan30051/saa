			border-radius: 50%;
			background: #ffe3c4;
			box-shadow: 0 0 8px 2px rgb(255 227 196 / 48%);
			opacity: .5;
			animation: fairy-twinkle var(--duration, 4s) ease-in-out var(--delay, 0s) infinite;
		}
		.finale-heart {
			position: absolute;
			left: var(--heart-x);
			bottom: -8vh;
			width: 24px;
			height: 24px;
			fill: #c9758a;
			stroke: #eaa0ae;
			stroke-width: .7;
			opacity: .25;
			filter: blur(.65px);
			animation: finale-heart-rise var(--float-duration, 48s) linear var(--float-delay, 0s) infinite;
		}
		.finale-copy {
			position: relative;
			z-index: 2;
			width: min(100%, 1000px);
			display: grid;
			gap: 0;
			color: #fff3ea;
			text-align: center;
			transform: translateY(-28px);
		}
		.guitar-line {
			width: 100%;
			min-height: 1.3em;
			color: #fff3ea;
			font: 400 clamp(24px, 6vw, 34px)/1.3 "Patrick Hand", cursive, sans-serif;
			text-shadow: 0 0 18px rgb(255 214 190 / 45%);
			text-align: center;
			text-wrap: balance;
			opacity: 0;
			transform: translateY(8px);
			transition: opacity 1200ms ease, transform 1200ms ease;
		}
		.guitar-line.visible { opacity: 1; transform: translateY(0); }
		.guitar-line.first-line { margin-bottom: 14px; }
		.guitar-line.second-line { font-size: clamp(34px, 9vw, 52px); }
		.rose-word {
			color: inherit;
			background-image: linear-gradient(transparent 48%, rgb(242 167 179 / 45%) 48% 100%);
			background-size: 0% 100%;
			background-repeat: no-repeat;
			box-decoration-break: clone;
			-webkit-box-decoration-break: clone;
			mix-blend-mode: screen;
		}
		.guitar-line.second-line.visible .rose-word { animation: finale-marker-swipe 700ms ease 1.2s forwards; }
		.her-name {
			min-height: 1.2em;
			margin-top: 36px;
			font: 400 clamp(22px, 5.5vw, 30px)/1.1 "Homemade Apple", cursive;
			color: #f6c1cb;
			text-shadow: 0 0 14px rgb(255 214 190 / 30%);
			opacity: 0;
			transform: translateY(6px) rotate(-2deg);
			transition: opacity 1500ms ease, transform 1500ms ease;
		}
		.her-name.visible { opacity: 1; transform: translateY(0) rotate(-2deg); }
		.audio-toggle {
			position: fixed;
			z-index: 8;
			top: max(16px, env(safe-area-inset-top));
			right: max(16px, env(safe-area-inset-right));
			width: 44px;
			height: 44px;
			display: grid;
			place-items: center;
			border: 1px solid rgb(255 243 234 / 30%);
			border-radius: 50%;
			background: rgb(255 243 234 / 15%);
			color: #fff3ea;
			cursor: pointer;
			backdrop-filter: blur(6px);
		}
		.audio-toggle svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
		body.finale-active #ambience .floaty { opacity: 0 !important; transition: none !important; }
		@media (max-width: 600px) {
			.finale-copy { width: 100%; }
			.guitar-line.first-line, .guitar-line.second-line { min-height: 2.65em; }
			.fairy-light:nth-of-type(n + 15), .finale-heart:nth-of-type(n + 5) { display: none; }
		}
		.floaty {
			position: absolute;
			left: var(--x);
			bottom: -12vh;
			width: var(--size);
			height: var(--size);
			color: var(--float-color);
			opacity: var(--float-opacity, .04);
			animation: float-up var(--float-duration, 18s) linear var(--float-delay, 0s) infinite;
			transition: opacity 1200ms ease;
		}
		.floaty svg { display: block; width: 100%; height: 100%; fill: currentColor; }
		#ambience.calm .floaty { animation-duration: 42s !important; }
		body.finale-active #ambience .floaty { opacity: .32 !important; }

		@keyframes fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
		@keyframes opening-text-in { to { opacity: 1; } }
		@keyframes opening-highlight { to { transform: scaleX(1) skewX(-5deg); } }
		@keyframes opening-button-in { to { opacity: 1; } }
		@keyframes float-up { from { transform: translate3d(0, 0, 0) rotate(-12deg); } to { transform: translate3d(20px, -120vh, 0) rotate(26deg); } }
		@keyframes finale-in { from { opacity: 0; } to { opacity: 1; } }
		@keyframes finale-marker-swipe { to { background-size: 100% 100%; } }
		@keyframes fairy-twinkle { 0%, 100% { opacity: .32; transform: scale(.8); } 50% { opacity: .9; transform: scale(1.2); } }
		@keyframes finale-heart-rise { from { transform: translateY(0) rotate(-8deg); } to { transform: translateY(-120vh) rotate(12deg); } }
		@keyframes final-hate-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
		@keyframes heartbeat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }

		@media (min-width: 700px) {

			.shell { min-height: calc(100svh - 64px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }

		}

	<script>
		// Edit these values before sharing the page.
		const FINALE_LINES = [
			"i can't buy you a guitar every time i mess up",
			"but i can make this for you instead"
		];
		const HER_NAME = "saanvi";
		const SIGNED_BY = "kathan";
		const HATE_LIST = [
			"i hate that one text from you can *change my whole mood*",
			"i hate that we run out of things to say and *somehow never stop*",
			"i hate that you got me into *books and music*, and now i can't enjoy either without thinking of you",
			"i hate how *cute* you are when you're being annoying on purpose",
			"i hate that you're the only person who can *roast me* and make my day better",
			"i hate that there's always *something different* about you that pulls me in",
			"i hate that you only have to *want* my attention and you already have it",
			"i hate that a *boring day* turns good the moment you show up in it",
			"i hate that you don't know how much you *matter* to me"
		];
		const FINAL_HATE = [
			"but mostly i hate the way i don't hate you",
			"not even a little bit",
			"not even close",
			"not even at all"
		];
		const HATE_TOTAL = HATE_LIST.length + 1;

		const colorWash = document.querySelector("#color-wash");
		const ambience = document.querySelector("#ambience");
		const opening = document.querySelector("#opening");
		const openingName = document.querySelector("#opening-name");
		const hateSequence = document.querySelector("#hate-sequence");

		const hateDots = document.querySelector("#hate-dots");
		const hateDoodle = hateItem.querySelector(".hate-doodle");
		const hateNext = document.querySelector("#hate-next");
		const hateNextLabel = document.querySelector("#hate-next-label");
		const finale = document.querySelector("#finale");
		const guitarFirst = document.querySelector("#guitar-line-first");
		const guitarSecond = document.querySelector("#guitar-line-second");
		const signedBy = document.querySelector("#signed-by");
		openingName.textContent = HER_NAME;
		const song = document.querySelector("#song");
		const audioToggle = document.querySelector("#audio-toggle");

		let finaleStarted = false;
		let hateIndex = -1;
		const floaties = [];

		function createAmbience() {
			const svgNamespace = "http://www.w3.org/2000/svg";
			for (let index = 0; index < 34; index += 1) {
				const floaty = document.createElement("span");
				const svg = document.createElementNS(svgNamespace, "svg");
				const shape = document.createElementNS(svgNamespace, "path");
				const isSparkle = index % 5 === 0;
				floaty.className = "floaty";
				floaty.style.setProperty("--x", `${Math.random() * 100}%`);
				floaty.style.setProperty("--size", `${12 + Math.random() * 22}px`);
				floaty.style.setProperty("--float-duration", `${14 + Math.random() * 15}s`);
				floaty.style.setProperty("--float-delay", `${-Math.random() * 24}s`);
				floaty.style.setProperty("--float-color", isSparkle ? "#fff7e9" : "#a85870");
				floaty.style.setProperty("--float-opacity", `${.015 + Math.random() * .025}`);
				svg.setAttribute("viewBox", "0 0 24 24");
				shape.setAttribute("d", isSparkle
					? "M12 1.5 14.7 9.3 22.5 12 14.7 14.7 12 22.5 9.3 14.7 1.5 12 9.3 9.3Z"
					: "M12 21s-8.5-5.2-8.5-11.2A4.7 4.7 0 0 1 12 7a4.7 4.7 0 0 1 8.5 2.8C20.5 15.8 12 21 12 21Z");
				svg.append(shape);
				floaty.append(svg);
				ambience.append(floaty);
				floaties.push(floaty);
			}
		}

		function mixHex(start, end, amount) {
			const startChannels = start.match(/[a-f\d]{2}/gi).map(value => parseInt(value, 16));
			const endChannels = end.match(/[a-f\d]{2}/gi).map(value => parseInt(value, 16));
			return `#${startChannels.map((value, index) => Math.round(value + (endChannels[index] - value) * amount).toString(16).padStart(2, "0")).join("")}`;
		}

		function updateListAtmosphere(index) {
			const warmth = Math.min(index / (HATE_TOTAL - 1), 1);
			colorWash.style.opacity = String(.035 + warmth * .72);
			const visibleCount = Math.ceil(floaties.length * (.12 + warmth * .88));
			floaties.forEach((floaty, floatIndex) => {
				floaty.style.setProperty("--float-opacity", floatIndex < visibleCount ? String(.06 + warmth * .26) : "0");
			});
		}

		function emphasizeText(container, text) {
			const fragments = text.split(/(\*[^*]+\*)/g);
			for (const fragment of fragments) {
				if (fragment.startsWith("*") && fragment.endsWith("*")) {
					const emphasis = document.createElement("span");
					emphasis.className = "hate-sweet";
					emphasis.textContent = fragment.slice(1, -1);
					container.append(emphasis);
				} else {
					container.append(document.createTextNode(fragment));
				}
			}
		}

		function addSequenceHeart(index) {
			const svgNamespace = "http://www.w3.org/2000/svg";
			const floaty = document.createElement("span");
			const svg = document.createElementNS(svgNamespace, "svg");
			const heart = document.createElementNS(svgNamespace, "path");
			floaty.className = "floaty";
			floaty.style.setProperty("--x", `${Math.random() * 100}%`);
			floaty.style.setProperty("--size", `${15 + Math.random() * 16}px`);
			floaty.style.setProperty("--float-duration", `${30 + Math.random() * 12}s`);
			floaty.style.setProperty("--float-delay", `${-Math.random() * 12}s`);
			floaty.style.setProperty("--float-color", "#a85870");
			floaty.style.setProperty("--float-opacity", String(.16 + index * .014));
			svg.setAttribute("viewBox", "0 0 24 24");
			heart.setAttribute("d", "M12 21s-8.5-5.2-8.5-11.2A4.7 4.7 0 0 1 12 7a4.7 4.7 0 0 1 8.5 2.8C20.5 15.8 12 21 12 21Z");
			svg.append(heart);
			floaty.append(svg);
			ambience.append(floaty);
			floaties.push(floaty);
		}

		function renderHateItem(index, transition = true) {
			hateNext.classList.remove("available");
			hateNext.disabled = true;
			const update = () => {
				const isFinalHate = index === HATE_LIST.length;
				hateIndex = index;
				hateSequence.dataset.item = String(index + 1);
				hateDots.querySelectorAll(".hate-dot").forEach((dot, dotIndex) => {
					dot.classList.toggle("past", dotIndex < index);
					dot.classList.toggle("current", dotIndex === index);
				});
				hateCopy.replaceChildren();
				hateCopy.classList.remove("list-copy-visible");
				hateRegularContent.hidden = isFinalHate;
				hateCopy.hidden = isFinalHate;
				finalHateLines.replaceChildren();
				finalHateLines.hidden = !isFinalHate;
				hateDoodle.classList.remove("visible");
				if (isFinalHate) {
					const firstPause = 2500;
					const lineInterval = 2000;
					const fadeDuration = 900;
					const lastLineDelay = fadeDuration + firstPause + (FINAL_HATE.length - 2) * lineInterval;
					for (let heart = 0; heart < 12; heart += 1) addSequenceHeart(index + heart + 1);
					FINAL_HATE.forEach((text, lineIndex) => {
						const delay = lineIndex === 0 ? 0 : fadeDuration + firstPause + (lineIndex - 1) * lineInterval;
						const line = document.createElement("p");
						line.className = "final-hate-line pending";
						if (lineIndex === FINAL_HATE.length - 1) {
							line.classList.add("last-line");
							const pulse = document.createElement("span");
							pulse.className = "last-line-pulse";
							pulse.textContent = text;
							line.append(pulse);
							window.setTimeout(() => pulse.classList.add("pulsing"), delay + fadeDuration);
						} else {
							line.textContent = text;
						}
						line.addEventListener("animationend", event => {
							if (event.target !== line || event.animationName !== "final-hate-in") return;
							line.style.opacity = "1";
							line.classList.remove("revealing");
						});
						finalHateLines.append(line);
						window.setTimeout(() => {
							line.classList.remove("pending");
							line.classList.add("revealing");
						}, delay);
					});
					window.setTimeout(() => hateDoodle.classList.add("visible"), lastLineDelay + fadeDuration + 350);
					window.setTimeout(() => {
						hateNext.classList.add("available");
						hateNext.disabled = false;
					}, lastLineDelay + fadeDuration + 2500);
				} else {
					const item = HATE_LIST[index];
					const words = hateCopy;
					const lead = item.match(/^i hate how\b/i);
					if (lead) {
						const leadElement = document.createElement("span");
						leadElement.className = "hate-lead";
						leadElement.textContent = lead[0];
						words.append(leadElement, document.createTextNode(" "));
						emphasizeText(words, item.slice(lead[0].length).trimStart());
					} else {
						emphasizeText(words, item);
					}
					requestAnimationFrame(() => hateCopy.classList.add("list-copy-visible"));
					window.setTimeout(() => hateDoodle.classList.add("visible"), 450);
				}
				if (isFinalHate) {
					hateSequence.style.background = "radial-gradient(ellipse at center, #fbf3ea 0%, #f8e8e3 48%, #f3cfd0 100%)";
					hateSequence.style.boxShadow = "none";
				} else {
					const warmth = index / Math.max(1, HATE_LIST.length - 1);
					const paperTone = mixHex("#fbf3ea", "#f6ddda", warmth);
					const roseTone = mixHex("#fbf3ea", "#f3cfd0", warmth);
					const cornerGlow = .015 + warmth * .09;
					hateSequence.style.background = `radial-gradient(ellipse at 100% 0%, rgb(244 201 204 / ${cornerGlow}) 0%, transparent 52%), linear-gradient(145deg, ${paperTone} 0%, ${roseTone} 100%)`;
					hateSequence.style.boxShadow = "none";
				}
				if (!isFinalHate) {
					addSequenceHeart(index + 1);
					hateNextLabel.textContent = "next";
					window.setTimeout(() => {
						hateNext.classList.add("available");
						hateNext.disabled = false;
					}, 2000);
				} else {
					hateNextLabel.textContent = "ok one more thing";
				}
				updateListAtmosphere(index);
			};

			if (transition) {
				hateItem.classList.add("item-leaving");
				window.setTimeout(() => {
					update();
					hateItem.classList.remove("item-leaving");
					hateItem.classList.add("item-entering");
					requestAnimationFrame(() => hateItem.classList.remove("item-entering"));
				}, 200);
			} else {
				update();
			}
		}

		function startHateSequence() {
			document.body.classList.add("hate-active");
			opening.classList.add("leaving");
			window.setTimeout(() => {
				opening.hidden = true;
				hateSequence.hidden = false;
				renderHateItem(0, false);
			}, 300);
		}

		function beginFinale() {
			if (finaleStarted) return;
			finaleStarted = true;
			document.body.classList.add("finale-active");
			document.body.classList.remove("hate-active");
			ambience.classList.add("calm");
			hateSequence.classList.add("hate-leaving");
			window.setTimeout(() => {
				hateSequence.hidden = true;
				finale.hidden = false;
				finale.classList.add("sunset-active");
				guitarFirst.textContent = FINALE_LINES[0];
				const secondText = FINALE_LINES[1];
				const highlightAt = secondText.indexOf("this");
				guitarSecond.append(document.createTextNode(secondText.slice(0, highlightAt)));
				const roseWord = document.createElement("span");
				roseWord.className = "rose-word";
				roseWord.textContent = "this";
				guitarSecond.append(roseWord, document.createTextNode(secondText.slice(highlightAt + 4)));
				signedBy.textContent = `- ${SIGNED_BY}`;
				updateAudioToggle();
				requestAnimationFrame(() => guitarFirst.classList.add("visible"));
				window.setTimeout(() => {
					guitarSecond.classList.add("visible");
					window.setTimeout(() => signedBy.classList.add("visible"), 3000);
				}, 4200);
			}, 450);
		}

		function updateAudioToggle() {
			const paused = song.paused || song.ended;
			for (const icon of audioToggle.querySelectorAll("[data-audio-state]")) {
				icon.hidden = icon.dataset.audioState !== (paused ? "paused" : "playing");
			}
			audioToggle.setAttribute("aria-label", paused ? "play song" : "pause song");
			audioToggle.title = paused ? "play song" : "pause song";
		}

		createAmbience();

		document.querySelector("#start-button").addEventListener("click", () => {
			startHateSequence();
		});
		hateNext.addEventListener("click", () => {
			if (hateIndex === HATE_LIST.length) {
				try { song.play().catch(() => {}); } catch {}
				beginFinale();
			} else {
				renderHateItem(hateIndex + 1);
			}
		});
		audioToggle.addEventListener("click", () => {
			if (song.paused || song.ended) {
				try { song.play().catch(() => {}); } catch {}
			} else {
				song.pause();
			}
			updateAudioToggle();
		});
		song.addEventListener("play", updateAudioToggle);
		song.addEventListener("pause", updateAudioToggle);
		song.addEventListener("ended", updateAudioToggle);
	</script>
</body>
</html>
